<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Mentat szerep-térkép / Mentat role map</title>
  <desc id="d">A gazda és nyolc ágens-szerep: asszisztens, PM, pénzügyi felelős, biztonsági felelős, flotta-menedzser, fejlesztő, kiadó ágens, termék-champion. A nyilak a munka útját mutatják; a jelvények azt, hogy a szerep asztalon és boxon is játszható. A flotta-menedzser csak boxon. Alul a közös alap: agy, tudástár, eszközök, backlog. / The owner and eight agent roles; arrows show how work flows; badges show desktop and box availability; the fleet manager is box-only; all roles share one brain, knowledge base, tools and backlog.</desc>
  <style>
    .bg { fill: none; }
    .node { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
    .human { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
    .expert { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .human.expert { stroke-dasharray: 6 4; }
    .sub.note { fill: #1f2328; font-size: 13px; }
    .base { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .label { fill: #1f2328; font-size: 17px; font-weight: 600; text-anchor: middle; }
    .sub { fill: #57606a; font-size: 12px; text-anchor: middle; }
    .edge { stroke: #57606a; stroke-width: 1.6; fill: none; }
    .edge.direct { stroke: #9a6700; stroke-dasharray: 5 4; }
    .edge.repair { stroke: #cf222e; stroke-dasharray: 3 4; }
    .elabel { fill: #1f2328; font-size: 12.5px; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
    .pill { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1; }
    .pill.na { fill: none; stroke: #8c959f; stroke-dasharray: 3 3; }
    .ptext { fill: #1a7f37; font-size: 11px; font-weight: 600; text-anchor: middle; }
    .ptext.na { fill: #8c959f; text-decoration: line-through; }
    .arrow { fill: #57606a; }
    .arrow.direct { fill: #9a6700; }
    .arrow.repair { fill: #cf222e; }
    @media (prefers-color-scheme: dark) {
      .node, .expert { fill: #161b22; stroke: #8b949e; }
      .human { fill: #2e2a10; stroke: #d29922; }
      .sub.note { fill: #e6edf3; }
      .base { fill: #0c2d4a; stroke: #4493f8; }
      .label, .elabel { fill: #e6edf3; }
      .elabel { stroke: #0d1117; }
      .sub { fill: #8b949e; }
      .edge { stroke: #8b949e; }
      .edge.direct { stroke: #d29922; }
      .edge.repair { stroke: #f85149; }
      .arrow { fill: #8b949e; }
      .arrow.direct { fill: #d29922; }
      .arrow.repair { fill: #f85149; }
      .pill { fill: #12261e; stroke: #3fb950; }
      .ptext { fill: #3fb950; }
      .pill.na { stroke: #6e7681; }
      .ptext.na { fill: #6e7681; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow direct" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow repair" d="M0,0 L10,5 L0,10 z"/></marker>
    <g id="both">
      <rect class="pill" x="-62" y="0" width="58" height="18" rx="9"/><text class="ptext" x="-33" y="13">asztal</text>
      <rect class="pill" x="4" y="0" width="58" height="18" rx="9"/><text class="ptext" x="33" y="13">box</text>
    </g>
    <g id="boxonly">
      <rect class="pill na" x="-62" y="0" width="58" height="18" rx="9"/><text class="ptext na" x="-33" y="13">asztal</text>
      <rect class="pill" x="4" y="0" width="58" height="18" rx="9"/><text class="ptext" x="33" y="13">box</text>
    </g>
  </defs>
  <rect class="bg" width="1000" height="700"/>

  <!-- edges first, so nodes sit on top -->
  <line class="edge" x1="210" y1="148" x2="418" y2="52" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="elabel" x="345" y="100">napi ügyek</text>
  <line class="edge" x1="500" y1="130" x2="500" y2="72" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="elabel" x="548" y="106">döntések</text>
  <line class="edge" x1="210" y1="176" x2="413" y2="176" marker-end="url(#a)"/>
  <text class="elabel" x="312" y="168">ötlet, kérés</text>
  <line class="edge" x1="790" y1="176" x2="587" y2="176" marker-end="url(#a)"/>
  <text class="elabel" x="688" y="168">nyitott döntések</text>
  <line class="edge" x1="468" y1="202" x2="322" y2="438" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="elabel" x="372" y="300">tétel ⇄ beadás</text>
  <line class="edge" x1="660" y1="438" x2="540" y2="202" marker-end="url(#a)"/>
  <text class="elabel" x="640" y="300">devops-javaslat</text>
  <line class="edge" x1="387" y1="475" x2="613" y2="475" marker-end="url(#a)"/>
  <text class="elabel" x="500" y="466">PR + teendő</text>
  <line class="edge" x1="210" y1="330" x2="440" y2="202" marker-end="url(#a)"/>
  <text class="elabel" x="252" y="282">leletek</text>
  <line class="edge" x1="160" y1="370" x2="250" y2="438" marker-end="url(#a)"/>
  <text class="elabel" x="176" y="414">review</text>
  <line class="edge" x1="560" y1="580" x2="660" y2="512" marker-end="url(#a)"/>
  <text class="elabel" x="640" y="560">állítás-ellenőrzés</text>
  <path class="edge direct" d="M787,490 H970 Q985,490 985,475 V60 Q985,45 970,45 H582" marker-end="url(#ad)"/>
  <text class="elabel" x="985" y="250" transform="rotate(90 985 250)">emberi sáv: jóváhagyás</text>
  <line class="edge repair" x1="850" y1="370" x2="740" y2="438" marker-end="url(#ar)"/>
  <text class="elabel" x="848" y="414">javítja, ha kiesik</text>

  <!-- the recommended composite main role -->
  <rect class="human expert" x="40" y="10" width="290" height="66" rx="10"/>
  <text class="sub note" x="185" y="30">Ajánlott fő szerep: személyi asszisztens</text>
  <text class="sub note" x="185" y="47">&amp; flottamenedzser = asszisztens + PM +</text>
  <text class="sub note" x="185" y="64">fejlesztő + kiadó + flotta-menedzser</text>

  <!-- nodes -->
  <rect class="human" x="420" y="20" width="160" height="52" rx="10"/>
  <text class="label" x="500" y="44">Gazda</text><text class="sub" x="500" y="62">ember</text>

  <rect class="node" x="40" y="130" width="170" height="72" rx="10"/>
  <text class="label" x="125" y="157">Asszisztens</text><use href="#both" x="125" y="172"/>
  <rect class="node" x="415" y="130" width="170" height="72" rx="10"/>
  <text class="label" x="500" y="157">PM</text><use href="#both" x="500" y="172"/>
  <rect class="node" x="790" y="130" width="170" height="72" rx="10"/>
  <text class="label" x="875" y="157">Pénzügyi felelős</text><use href="#both" x="875" y="172"/>

  <rect class="expert" x="40" y="298" width="170" height="72" rx="10"/>
  <text class="label" x="125" y="325">Biztonsági felelős</text><use href="#both" x="125" y="340"/>
  <rect class="node" x="790" y="298" width="170" height="72" rx="10"/>
  <text class="label" x="875" y="325">Flotta-menedzser</text><use href="#boxonly" x="875" y="340"/>

  <rect class="node" x="215" y="440" width="170" height="72" rx="10"/>
  <text class="label" x="300" y="467">Fejlesztő</text><use href="#both" x="300" y="482"/>
  <rect class="node" x="615" y="440" width="170" height="72" rx="10"/>
  <text class="label" x="700" y="467">Kiadó ágens</text><use href="#both" x="700" y="482"/>

  <rect class="expert" x="390" y="560" width="170" height="60" rx="10"/>
  <text class="label" x="475" y="585">Termék-champion</text><use href="#both" x="475" y="595"/>

  <rect class="base" x="40" y="640" width="920" height="44" rx="10"/>
  <text class="label" x="500" y="668">Közös alap: Mentat-agy · tudástár · eszközök · backlog és labda</text>
</svg>
