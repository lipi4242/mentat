name: Feature request
description: An idea for Mentat, or something it should do better.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: How you would like it to work. A rough idea is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
  - type: dropdown
    id: part
    attributes:
      label: Which part
      options:
        - Brain (install, skills, reference tools)
        - Engine (engine/)
        - Fleet (server runtime, Telegram bridge, plugin)
        - Admin (web app and API)
        - Not sure
