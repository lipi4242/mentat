[project]
name = "mentat-engine"
version = "0.6.1"
description = "Concern-based proactive orchestrator engine (shared core for Mentat agents)"
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
